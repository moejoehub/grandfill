<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grand Fill</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFF8F0;--bg2:#fff;--bg3:#F5EFE8;--border:#E8DECE;
  --text:#2D2015;--text2:#7A6555;--text3:#B8A898;
  --shadow:rgba(80,40,10,.12);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif}
body{display:flex;align-items:center;justify-content:center}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:20px;opacity:0;pointer-events:none;
  transition:opacity .28s,transform .28s;transform:translateY(8px);overflow-y:auto}
.screen.active{opacity:1;pointer-events:all;transform:none}
.screen.out{opacity:0;transform:translateY(-8px)}

/* ── MENU ── */
.menu-deco{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.dc{position:absolute;border-radius:50%;opacity:.13}
.dc1{width:320px;height:320px;background:radial-gradient(circle,#FF6B9D,transparent);top:-60px;right:-60px}
.dc2{width:280px;height:280px;background:radial-gradient(circle,#4ECDC4,transparent);bottom:-40px;left:-80px}
.dc3{width:200px;height:200px;background:radial-gradient(circle,#FFD93D,transparent);top:40%;left:5%}

.logo{text-align:center;margin-bottom:44px}
.logo-eye{font-size:.68rem;letter-spacing:.3em;text-transform:uppercase;color:#FF6B9D;
  font-family:'IBM Plex Mono',monospace;font-weight:700;margin-bottom:10px}
.logo-name{font-size:clamp(3.5rem,14vw,6rem);font-weight:900;letter-spacing:-.03em;line-height:.88;
  background:linear-gradient(135deg,#FF6B9D 0%,#FF8E53 40%,#FFD93D 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 2px 12px rgba(255,107,157,.25))}
.logo-tag{font-size:.85rem;color:var(--text2);margin-top:12px;font-weight:600}

.play-btn{background:linear-gradient(135deg,#FF6B9D,#FF8E53);border:none;color:#fff;
  font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:800;padding:15px 54px;
  cursor:pointer;border-radius:50px;letter-spacing:.04em;
  box-shadow:0 6px 24px rgba(255,107,157,.4);transition:all .2s;
  animation:pp 2.5s ease-in-out infinite}
.play-btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(255,107,157,.5)}
@keyframes pp{0%,100%{box-shadow:0 6px 24px rgba(255,107,157,.4),0 0 0 0 rgba(255,107,157,.25)}
  50%{box-shadow:0 6px 24px rgba(255,107,157,.4),0 0 0 14px rgba(255,107,157,0)}}
.menu-modes{display:flex;gap:14px;margin-top:28px}
.mm-pill{display:flex;align-items:center;gap:8px;padding:9px 18px;background:var(--bg2);
  border-radius:50px;font-size:.82rem;font-weight:700;box-shadow:0 2px 10px var(--shadow);color:var(--text2)}

/* ── LEVEL SELECT ── */
#lvlScreen{justify-content:flex-start;padding-top:0}
.ls-top{width:100%;max-width:560px;display:flex;align-items:center;
  justify-content:space-between;padding:16px 0 12px;flex-shrink:0}
.ls-ttl{font-size:1.2rem;font-weight:800}
.bbtn{background:var(--bg2);border:2px solid var(--border);color:var(--text2);
  font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:700;padding:6px 16px;
  cursor:pointer;border-radius:50px;transition:all .15s}
.bbtn:hover{border-color:var(--text3);color:var(--text)}
.ls-scroll{width:100%;max-width:560px;overflow-y:auto;padding-bottom:24px;flex:1}
.mode-section{margin-bottom:28px}
.ms-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ms-icon{font-size:1.2rem}
.ms-label{font-size:1rem;font-weight:800}
.ms-badge{font-size:.63rem;font-weight:700;padding:3px 10px;border-radius:50px;
  font-family:'IBM Plex Mono',monospace;letter-spacing:.06em}
.ms-badge.box{background:#E8F4FF;color:#3B82F6}
.ms-badge.free{background:#E8FFF8;color:#10B981}
.tiles-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.tile{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  transition:all .18s;position:relative;overflow:hidden;
  box-shadow:0 3px 10px var(--shadow)}
.tile::before{content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.28) 0%,transparent 60%);pointer-events:none}
.tile:hover:not(.tlk){transform:translateY(-3px) scale(1.05);box-shadow:0 8px 20px var(--shadow)}
.tile:active:not(.tlk){transform:scale(.97)}
.tile.tlk{opacity:.32;cursor:not-allowed;filter:grayscale(.5)}
.tile-num{font-size:1.5rem;font-weight:900;color:#fff;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.2)}
.tile-stars{display:flex;gap:2px;margin-top:4px}
.tile-stars span{font-size:.55rem;opacity:.35;color:#fff}
.tile-stars span.lit{opacity:1}
.lock-ico{font-size:1rem;margin-top:3px;opacity:.65}
.tc0{background:linear-gradient(135deg,#FF6B9D,#FF8E53)}
.tc1{background:linear-gradient(135deg,#FF8E53,#FFD93D)}
.tc2{background:linear-gradient(135deg,#A8E063,#56AB2F)}
.tc3{background:linear-gradient(135deg,#4ECDC4,#44A08D)}
.tc4{background:linear-gradient(135deg,#45B7D1,#2980B9)}
.tc5{background:linear-gradient(135deg,#667EEA,#764BA2)}
.tc6{background:linear-gradient(135deg,#F857A6,#FF5858)}
.tc7{background:linear-gradient(135deg,#4ECDC4,#556270)}
.tc8{background:linear-gradient(135deg,#F7971E,#FFD200)}
.tc9{background:linear-gradient(135deg,#11998E,#38EF7D)}

/* ── GAME ── */
#gameScreen{justify-content:flex-start;padding:10px 14px;gap:0}
.g-top{width:100%;max-width:520px;display:flex;align-items:center;
  justify-content:space-between;padding:10px 0 6px;flex-shrink:0}
.g-left .g-lnum{font-size:.6rem;font-family:'IBM Plex Mono',monospace;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:1px}
.g-left .g-lname{font-size:.9rem;font-weight:800}
.g-right{display:flex;align-items:center;gap:8px}
.mode-badge{font-size:.6rem;font-family:'IBM Plex Mono',monospace;font-weight:700;
  padding:4px 10px;border-radius:50px;letter-spacing:.06em}
.mode-badge.box{background:#EBF3FF;color:#3B82F6}
.mode-badge.free{background:#E8FFF5;color:#10B981}
.g-ibtn{background:var(--bg2);border:2px solid var(--border);color:var(--text2);
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border-radius:50%;font-size:.88rem;transition:all .15s;
  box-shadow:0 2px 6px var(--shadow)}
.g-ibtn:hover{border-color:var(--text3);color:var(--text);transform:scale(1.06)}

/* ── BIG CENTERED HUD COUNTER ── */
.hud-wrap{width:100%;max-width:520px;display:flex;justify-content:center;
  margin-bottom:8px;flex-shrink:0;min-height:58px;align-items:center}
.hud-counter{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--bg2);border:3px solid var(--border);
  border-radius:20px;padding:8px 28px;
  box-shadow:0 4px 16px var(--shadow);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  opacity:0;transform:scale(.75) translateY(-6px);pointer-events:none;
  min-width:120px;
}
.hud-counter.visible{opacity:1;transform:scale(1) translateY(0);pointer-events:all}
.hud-counter.match{
  border-color:#6BCB77;
  background:linear-gradient(135deg,#6BCB77,#4ECDC4);
  box-shadow:0 6px 24px rgba(107,203,119,.45);
  animation:match-bounce .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes match-bounce{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.hud-num{font-size:2rem;font-weight:900;font-family:'IBM Plex Mono',monospace;
  color:var(--text);line-height:1;transition:color .2s}
.hud-counter.match .hud-num{color:#fff}
.hud-lbl{font-size:.58rem;font-family:'IBM Plex Mono',monospace;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-top:1px;transition:color .2s}
.hud-counter.match .hud-lbl{color:rgba(255,255,255,.75)}

/* ── CANVAS ── */
.c-wrap{border:3px solid var(--border);border-radius:16px;overflow:hidden;
  background:#fff;flex-shrink:0;box-shadow:0 4px 20px var(--shadow)}
canvas{display:block;user-select:none;touch-action:none;cursor:crosshair}

.g-status{font-family:'IBM Plex Mono',monospace;font-size:.68rem;font-weight:600;
  color:var(--text3);min-height:16px;text-align:center;letter-spacing:.04em;
  margin-top:7px;flex-shrink:0;transition:color .2s}
.g-status.ok{color:#10B981}
.g-status.err{color:#EF4444}
.g-status.hint{color:#F59E0B}

.ctrl-row{display:flex;gap:8px;margin-top:8px;flex-shrink:0;justify-content:center}
.c-btn{background:var(--bg2);border:2px solid var(--border);color:var(--text2);
  font-family:'Nunito',sans-serif;font-size:.75rem;font-weight:700;padding:7px 18px;
  cursor:pointer;border-radius:50px;transition:all .15s;box-shadow:0 2px 6px var(--shadow)}
.c-btn:hover{border-color:var(--text3);color:var(--text)}
.c-btn.rd:hover{border-color:#EF4444;color:#EF4444}

/* ── WIN ── */
.ovl{position:fixed;inset:0;background:rgba(255,248,240,.88);display:flex;align-items:center;
  justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;
  z-index:300;backdrop-filter:blur(10px);padding:20px}
.ovl.show{opacity:1;pointer-events:all}
.wbox{background:var(--bg2);border:2px solid var(--border);border-radius:24px;
  padding:32px 36px;text-align:center;max-width:320px;width:100%;
  transform:translateY(16px) scale(.95);transition:transform .45s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 20px 60px var(--shadow)}
.ovl.show .wbox{transform:none}
.w-em{font-size:3rem;margin-bottom:8px;display:block}
.w-ttl{font-size:1.5rem;font-weight:900;letter-spacing:-.02em;margin-bottom:3px}
.w-sub{font-size:.78rem;color:var(--text2);margin-bottom:16px;font-family:'IBM Plex Mono',monospace;font-weight:600}
.w-stars{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.w-star{font-size:2.2rem;filter:grayscale(1);opacity:.15;transition:all .4s;transform:scale(.7)}
.w-star.lit{filter:none;opacity:1;transform:scale(1);animation:sp .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes sp{0%{transform:scale(0)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.w-stats{display:flex;gap:10px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.w-stat{background:var(--bg3);border:2px solid var(--border);padding:8px 14px;border-radius:12px;
  font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--text2);font-weight:600}
.w-stat strong{display:block;font-size:1rem;color:var(--text);font-family:'Nunito',sans-serif;font-weight:800}
.w-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.w-btn{font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:800;padding:10px 22px;
  cursor:pointer;border-radius:50px;transition:all .15s;border:none}
.w-btn.pri{background:linear-gradient(135deg,#FF6B9D,#FF8E53);color:#fff;
  box-shadow:0 4px 14px rgba(255,107,157,.35)}
.w-btn.pri:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(255,107,157,.45)}
.w-btn.sec{background:var(--bg3);border:2px solid var(--border);color:var(--text2)}
.w-btn.sec:hover{border-color:var(--text3);color:var(--text)}

@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-5px)}
  35%{transform:translateX(5px)}55%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shk{animation:shake .35s ease}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<!-- MENU -->
<div class="screen active" id="menuScreen">
  <div class="menu-deco">
    <div class="dc dc1"></div><div class="dc dc2"></div><div class="dc dc3"></div>
  </div>
  <div class="logo">
    <div class="logo-eye">Puzzle · Logic · Strategy</div>
    <div class="logo-name">GRAND<br>FILL</div>
    <div class="logo-tag">Fill the grid. Master the space.</div>
  </div>
  <button class="play-btn" onclick="goTo('lvlScreen')">▶ PLAY NOW</button>
  <div class="menu-modes">
    <div class="mm-pill">▦ Box Mode</div>
    <div class="mm-pill">✏ Free Path</div>
  </div>
</div>

<!-- LEVEL SELECT -->
<div class="screen" id="lvlScreen">
  <div class="ls-top">
    <div class="ls-ttl">Choose a Level</div>
    <button class="bbtn" onclick="goTo('menuScreen')">← Menu</button>
  </div>
  <div class="ls-scroll" id="lvlGrid"></div>
</div>

<!-- GAME -->
<div class="screen" id="gameScreen">
  <div class="g-top">
    <div class="g-left">
      <div class="g-lnum" id="gln">LEVEL 1</div>
      <div class="g-lname" id="glt">First Steps</div>
    </div>
    <div class="g-right">
      <div class="mode-badge box" id="modeBadge">BOX</div>
      <div class="g-ibtn" onclick="undoLast()" title="Undo last region">↩</div>
      <div class="g-ibtn" onclick="goTo('lvlScreen')" title="Back to levels">☰</div>
    </div>
  </div>

  <!-- BIG CENTERED HUD COUNTER -->
  <div class="hud-wrap">
    <div class="hud-counter" id="hudCounter">
      <div class="hud-num" id="hudNum">0</div>
      <div class="hud-lbl" id="hudLbl">CELLS</div>
    </div>
  </div>

  <div class="c-wrap" id="cwrap">
    <canvas id="gc"></canvas>
  </div>

  <div class="g-status" id="gst">Tap a region to remove it · Drag to draw</div>
  <div class="ctrl-row">
    <button class="c-btn" onclick="undoLast()">↩ Undo Last</button>
    <button class="c-btn rd" onclick="clearAll()">✕ Clear All</button>
  </div>
</div>

<!-- WIN -->
<div class="ovl" id="winOvl">
  <div class="wbox">
    <span class="w-em" id="wem">🎉</span>
    <div class="w-ttl" id="wttl">Level Complete!</div>
    <div class="w-sub" id="wsub"></div>
    <div class="w-stars">
      <span class="w-star" id="ws1">★</span>
      <span class="w-star" id="ws2">★</span>
      <span class="w-star" id="ws3">★</span>
    </div>
    <div class="w-stats">
      <div class="w-stat"><strong id="wmov">0</strong>Regions</div>
      <div class="w-stat"><strong id="wtim">0s</strong>Time</div>
    </div>
    <div class="w-acts">
      <button class="w-btn sec" onclick="retryLevel()">↺ Retry</button>
      <button class="w-btn sec" onclick="goTo('lvlScreen')">☰ Levels</button>
      <button class="w-btn pri" id="wnxt" onclick="nextLevel()">Next →</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════
//  LEVEL DEFINITIONS
//  rects: [r1, c1, r2, c2]
//  number placed at center of each rect
// ════════════════════════════════════════
const LEVEL_DEFS = [
  // BOX LEVELS 1-10
  {id:1,  name:"First Steps",   mode:"box",  size:4, diff:"easy",
   rects:[[0,0,1,1],[0,2,0,3],[1,2,1,3],[2,0,3,1],[2,2,3,3]]},

  {id:2,  name:"Warm Up",       mode:"box",  size:4, diff:"easy",
   rects:[[0,0,0,3],[1,0,2,1],[1,2,1,3],[2,2,3,3],[3,0,3,1]]},

  {id:3,  name:"Corners",       mode:"box",  size:5, diff:"easy",
   rects:[[0,0,0,4],[1,0,2,1],[1,2,2,2],[1,3,2,4],[3,0,4,1],[3,2,3,4],[4,2,4,4]]},

  {id:4,  name:"Crossroads",    mode:"box",  size:5, diff:"easy",
   rects:[[0,0,0,2],[0,3,1,4],[1,0,2,1],[1,2,2,4],[3,0,4,1],[3,2,4,4]]},

  {id:5,  name:"Blocks",        mode:"box",  size:5, diff:"medium",
   rects:[[0,0,2,0],[0,1,0,4],[1,1,2,2],[1,3,2,4],[3,0,3,4],[4,0,4,4]]},

  {id:6,  name:"Gridlock",      mode:"box",  size:6, diff:"medium",
   rects:[[0,0,0,5],[1,0,2,2],[1,3,2,4],[1,5,3,5],[3,0,4,1],[3,2,4,4],[4,5,5,5],[5,0,5,4]]},

  {id:7,  name:"Partitions",    mode:"box",  size:6, diff:"medium",
   rects:[[0,0,1,2],[0,3,1,5],[2,0,3,0],[2,1,4,2],[2,3,2,5],[3,3,4,5],[4,0,5,0],[5,1,5,5]]},

  {id:8,  name:"Labyrinth",     mode:"box",  size:6, diff:"hard",
   rects:[[0,0,2,1],[0,2,0,5],[1,2,2,4],[1,5,2,5],[3,0,4,1],[3,2,4,3],[3,4,4,5],[5,0,5,5]]},

  {id:9,  name:"Seven",         mode:"box",  size:7, diff:"hard",
   rects:[[0,0,0,6],[1,0,2,2],[1,3,2,4],[1,5,3,6],[3,0,4,1],[3,2,4,4],[4,5,5,6],[5,0,5,4],[6,0,6,2],[6,3,6,6]]},

  {id:10, name:"Grand Box",     mode:"box",  size:8, diff:"hard",
   rects:[[0,0,0,7],[1,0,2,1],[1,2,2,5],[1,6,2,7],[3,0,4,1],[3,2,4,5],[3,6,4,7],[5,0,6,1],[5,2,6,5],[5,6,7,7],[7,0,7,5],[7,6,7,7]]},

  // FREE PATH LEVELS 11-20
  {id:11, name:"L-Shape Intro", mode:"free", size:4, diff:"easy",
   rects:[[0,0,1,1],[0,2,0,3],[1,2,1,3],[2,0,3,1],[2,2,3,3]]},

  {id:12, name:"Snake",         mode:"free", size:4, diff:"easy",
   rects:[[0,0,0,3],[1,0,2,1],[1,2,1,3],[2,2,3,3],[3,0,3,1]]},

  {id:13, name:"Zigzag",        mode:"free", size:5, diff:"easy",
   rects:[[0,0,0,4],[1,0,2,1],[1,2,2,2],[1,3,2,4],[3,0,4,1],[3,2,3,4],[4,2,4,4]]},

  {id:14, name:"U-Turn",        mode:"free", size:5, diff:"easy",
   rects:[[0,0,0,2],[0,3,1,4],[1,0,2,1],[1,2,2,4],[3,0,4,1],[3,2,4,4]]},

  {id:15, name:"T-Junction",    mode:"free", size:5, diff:"medium",
   rects:[[0,0,2,0],[0,1,0,4],[1,1,2,2],[1,3,2,4],[3,0,3,4],[4,0,4,4]]},

  {id:16, name:"Winding Road",  mode:"free", size:6, diff:"medium",
   rects:[[0,0,0,5],[1,0,2,2],[1,3,2,4],[1,5,3,5],[3,0,4,1],[3,2,4,4],[4,5,5,5],[5,0,5,4]]},

  {id:17, name:"The S-Curve",   mode:"free", size:6, diff:"medium",
   rects:[[0,0,1,2],[0,3,1,5],[2,0,3,0],[2,1,4,2],[2,3,2,5],[3,3,4,5],[4,0,5,0],[5,1,5,5]]},

  {id:18, name:"Spiral",        mode:"free", size:6, diff:"hard",
   rects:[[0,0,2,1],[0,2,0,5],[1,2,2,4],[1,5,2,5],[3,0,4,1],[3,2,4,3],[3,4,4,5],[5,0,5,5]]},

  {id:19, name:"Free Seven",    mode:"free", size:7, diff:"hard",
   rects:[[0,0,0,6],[1,0,2,2],[1,3,2,4],[1,5,3,6],[3,0,4,1],[3,2,4,4],[4,5,5,6],[5,0,5,4],[6,0,6,2],[6,3,6,6]]},

  {id:20, name:"Grand Free",    mode:"free", size:8, diff:"hard",
   rects:[[0,0,0,7],[1,0,2,1],[1,2,2,5],[1,6,2,7],[3,0,4,1],[3,2,4,5],[3,6,4,7],[5,0,6,1],[5,2,6,5],[5,6,7,7],[7,0,7,5],[7,6,7,7]]},
];

const TOTAL = LEVEL_DEFS.length;

function buildGrid(ld) {
  const g = Array.from({length:ld.size}, () => Array(ld.size).fill(0));
  ld.rects.forEach(([r1,c1,r2,c2]) => {
    const area = (r2-r1+1)*(c2-c1+1);
    const nr = Math.floor((r1+r2)/2), nc = Math.floor((c1+c2)/2);
    g[nr][nc] = area;
  });
  return g;
}

const PAL = [
  [255,107,157],[255,142,83],[255,210,61],[107,203,119],
  [78,205,196],[69,160,210],[130,110,234],[200,85,200],
  [240,90,90],[245,170,30],[50,200,150],[160,100,230],
];

// ── PROGRESS ──
function lp(){try{return JSON.parse(localStorage.getItem('gf5')||'{}')}catch{return{}}}
function sp(id,stars){const p=lp();if((p[id]||0)<stars){p[id]=stars;localStorage.setItem('gf5',JSON.stringify(p))}}
function gs(id){return lp()[id]||0}
function unlocked(id){
  if(id===1||id===11) return true;
  // Box levels: need previous box level done
  // Free levels: need previous free level done
  return gs(id-1) > 0;
}

// ── NAV ──
let curScreen = 'menuScreen';
function goTo(id) {
  const old=document.getElementById(curScreen), nxt=document.getElementById(id);
  old.classList.add('out');
  setTimeout(()=>old.classList.remove('active','out'), 300);
  nxt.classList.add('active');
  curScreen = id;
  if(id==='lvlScreen') renderLevels();
}

// ── LEVEL SELECT ──
function renderLevels() {
  const el = document.getElementById('lvlGrid');
  const boxLvls  = LEVEL_DEFS.filter(l=>l.mode==='box');
  const freeLvls = LEVEL_DEFS.filter(l=>l.mode==='free');

  function tilesHTML(levels) {
    return levels.map((l,idx) => {
      const lk = !unlocked(l.id), st = gs(l.id);
      const stars = [1,2,3].map(i=>`<span class="${i<=st?'lit':''}"">★</span>`).join('');
      return `<div class="tile tc${idx%10}${lk?' tlk':''}" onclick="startLevel(${l.id})">
        <div class="tile-num">${l.id}</div>
        ${lk?`<div class="lock-ico">🔒</div>`:`<div class="tile-stars">${stars}</div>`}
      </div>`;
    }).join('');
  }

  el.innerHTML = `
    <div class="mode-section">
      <div class="ms-head">
        <span class="ms-icon">▦</span>
        <span class="ms-label">Box Mode</span>
        <span class="ms-badge box">RECTANGLE</span>
      </div>
      <div class="tiles-grid">${tilesHTML(boxLvls)}</div>
    </div>
    <div class="mode-section">
      <div class="ms-head">
        <span class="ms-icon">✏</span>
        <span class="ms-label">Free Path</span>
        <span class="ms-badge free">ANY SHAPE</span>
      </div>
      <div class="tiles-grid">${tilesHTML(freeLvls)}</div>
    </div>`;
}

// ── GAME STATE ──
const gc = document.getElementById('gc'), ctx = gc.getContext('2d');
let lvlDef, grid, gridSize, CS;
let regions = [], owner = [];
let curLvlId = 1, moves = 0, t0 = 0;

// Box drag
let bDrag = false, bA = null, bB = null;
// Free paint
let fPaint = false, fCells = [], fSet = new Set();
// fOrder[key] = index in fCells, for backtracking
let fOrder = {};

function startLevel(id) {
  if(!unlocked(id)) return;
  curLvlId = id;
  lvlDef = LEVEL_DEFS.find(l=>l.id===id);
  gridSize = lvlDef.size;
  grid = buildGrid(lvlDef);

  const avail = Math.min(window.innerWidth-28, window.innerHeight-240, 500);
  CS = Math.max(36, Math.min(68, Math.floor(avail/gridSize)));
  gc.width = gc.height = gridSize*CS;

  regions=[]; moves=0; t0=Date.now();
  owner=Array.from({length:gridSize},()=>Array(gridSize).fill(-1));
  resetDrag();

  document.getElementById('gln').textContent = 'LEVEL '+id;
  document.getElementById('gln').style.color = {easy:'#6BCB77',medium:'#F59B2B',hard:'#EF4444'}[lvlDef.diff]||'#888';
  document.getElementById('glt').textContent = lvlDef.name;
  const mb = document.getElementById('modeBadge');
  mb.textContent = lvlDef.mode==='box'?'BOX':'FREE';
  mb.className = 'mode-badge '+lvlDef.mode;

  // Close win if open
  document.getElementById('winOvl').classList.remove('show');
  hideHUD();
  setStatus('Tap a placed region to remove it · Drag to draw');
  if(curScreen !== 'gameScreen') goTo('gameScreen');
  draw();
}

function resetDrag(){
  bDrag=false;bA=null;bB=null;
  fPaint=false;fCells=[];fSet.clear();fOrder={};
}

// ── HUD ──
function showHUD(n, isMatch) {
  const el=document.getElementById('hudCounter');
  document.getElementById('hudNum').textContent = n;
  document.getElementById('hudLbl').textContent = isMatch ? '✓ PLACE IT!' : 'CELLS';
  el.classList.add('visible');
  if(isMatch) el.classList.add('match');
  else el.classList.remove('match');
}
function hideHUD() {
  const el=document.getElementById('hudCounter');
  el.classList.remove('visible','match');
}

// ── HELPERS ──
function ptoc(x,y){const c=Math.floor(x/CS),r=Math.floor(y/CS);return(r>=0&&r<gridSize&&c>=0&&c<gridSize)?{r,c}:null}
function ck(r,c){return r*1000+c}
function normR(a,b){return{r1:Math.min(a.r,b.r),c1:Math.min(a.c,b.c),r2:Math.max(a.r,b.r),c2:Math.max(a.c,b.c)}}
function conn(cells){
  if(!cells.length)return true;
  const ks=new Set(cells.map(({r,c})=>ck(r,c))),vis=new Set(),q=[cells[0]];
  vis.add(ck(cells[0].r,cells[0].c));
  while(q.length){const{r,c}=q.shift();for(const[dr,dc]of[[-1,0],[1,0],[0,-1],[0,1]]){const k=ck(r+dr,c+dc);if(ks.has(k)&&!vis.has(k)){vis.add(k);q.push({r:r+dr,c:c+dc})}}}
  return vis.size===ks.size;
}

// Current drag info (cell count + match check)
function dragInfo() {
  let cells = [];
  if(lvlDef.mode==='box' && bDrag && bA && bB) {
    const{r1,c1,r2,c2}=normR(bA,bB);
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) cells.push({r,c});
  } else if(lvlDef.mode==='free' && fPaint) {
    cells = fCells;
  }
  const n = cells.length;
  let numInDrag=0;
  for(const{r,c}of cells) if(grid[r][c]>0){numInDrag=grid[r][c];break}
  const isMatch = n>0 && numInDrag>0 && n===numInDrag;
  return {n, isMatch};
}

// ── PLACE ──
function place(cells) {
  // Check overlap
  for(const{r,c}of cells) if(owner[r][c]>=0){err('That space is taken!');return false}
  let nums=0,val=0;
  for(const{r,c}of cells) if(grid[r][c]>0){nums++;val=grid[r][c]}
  if(!nums){err('Must contain a number!');return false}
  if(nums>1){err('Only one number per region!');return false}
  if(val!==cells.length){err(`${cells.length} cells — needs ${val}!`);return false}
  const ri=regions.length;
  regions.push({cells:[...cells],color:PAL[ri%PAL.length]});
  for(const{r,c}of cells)owner[r][c]=ri;
  moves++;
  setStatus('✓ Region placed! Tap it to remove.','ok');
  draw();checkWin();
  return true;
}

// ── REMOVE REGION (click to destroy) ──
function removeRegion(ri) {
  const reg = regions[ri];
  for(const{r,c}of reg.cells) owner[r][c]=-1;
  regions.splice(ri,1);
  // Re-index owner for all regions after ri
  for(let r=0;r<gridSize;r++) for(let c=0;c<gridSize;c++) if(owner[r][c]>ri) owner[r][c]--;
  setStatus('Region removed — redraw it!','hint');
  draw();
}

function tryBox(){
  const{r1,c1,r2,c2}=normR(bA,bB);
  const cells=[];for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)cells.push({r,c});
  place(cells);
}
function tryFree(){
  if(!fCells.length)return;
  if(!conn(fCells)){err('Shape must be connected!');resetDrag();draw();return}
  place(fCells);
}

// ── WIN ──
function checkWin(){
  for(let r=0;r<gridSize;r++)for(let c=0;c<gridSize;c++)if(owner[r][c]<0)return;
  const elapsed=Math.round((Date.now()-t0)/1000);
  const optimal=lvlDef.rects.length;
  const stars=moves<=optimal?3:moves<=optimal+2?2:1;
  sp(curLvlId,stars);
  setTimeout(()=>{
    ['ws1','ws2','ws3'].forEach((sid,i)=>{
      const el=document.getElementById(sid);el.classList.remove('lit');
      if(i<stars)setTimeout(()=>el.classList.add('lit'),180+i*200);
    });
    document.getElementById('wem').textContent=stars===3?'🏆':stars===2?'🎉':'✅';
    document.getElementById('wttl').textContent=stars===3?'Perfect!':'Level Complete!';
    document.getElementById('wsub').textContent=lvlDef.name+' · '+(lvlDef.mode==='box'?'Box Mode':'Free Path');
    document.getElementById('wmov').textContent=moves;
    document.getElementById('wtim').textContent=elapsed+'s';
    document.getElementById('wnxt').style.display=curLvlId<TOTAL?'inline-flex':'none';
    document.getElementById('winOvl').classList.add('show');
  },350);
}

function retryLevel(){
  document.getElementById('winOvl').classList.remove('show');
  startLevel(curLvlId);
}
function nextLevel(){
  document.getElementById('winOvl').classList.remove('show');
  if(curLvlId < TOTAL) startLevel(curLvlId+1);
}

function undoLast(){
  if(!regions.length)return;
  const last=regions.pop();
  for(const{r,c}of last.cells)owner[r][c]=-1;
  moves=Math.max(0,moves-1);
  setStatus('Last region removed','hint');draw();
}
function clearAll(){
  regions=[];moves=0;owner=Array.from({length:gridSize},()=>Array(gridSize).fill(-1));
  resetDrag();setStatus('Board cleared');hideHUD();draw();
}

// ── STATUS ──
let _st;
function setStatus(m,type=''){
  const el=document.getElementById('gst');el.textContent=m;
  el.className='g-status'+(type?' '+type:'');
  clearTimeout(_st);if(type)_st=setTimeout(()=>{el.textContent='Tap a region to remove · Drag to draw';el.className='g-status'},2800);
}
let _sk;
function err(m){
  setStatus(m,'err');
  const w=document.getElementById('cwrap');
  w.classList.remove('shk');void w.offsetWidth;w.classList.add('shk');
  clearTimeout(_sk);_sk=setTimeout(()=>w.classList.remove('shk'),370);
}

// ── DRAW ──
function borders(cells,col,alpha,dash){
  const s=new Set(cells.map(({r,c})=>ck(r,c)));
  ctx.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},${alpha})`;
  ctx.lineWidth=3;ctx.lineJoin='round';
  ctx.setLineDash(dash?[4,3]:[]);
  cells.forEach(({r,c})=>{
    const x=c*CS,y=r*CS;
    if(!s.has(ck(r-1,c))){ctx.beginPath();ctx.moveTo(x+1,y+1.5);ctx.lineTo(x+CS-1,y+1.5);ctx.stroke()}
    if(!s.has(ck(r+1,c))){ctx.beginPath();ctx.moveTo(x+1,y+CS-1.5);ctx.lineTo(x+CS-1,y+CS-1.5);ctx.stroke()}
    if(!s.has(ck(r,c-1))){ctx.beginPath();ctx.moveTo(x+1.5,y+1);ctx.lineTo(x+1.5,y+CS-1);ctx.stroke()}
    if(!s.has(ck(r,c+1))){ctx.beginPath();ctx.moveTo(x+CS-1.5,y+1);ctx.lineTo(x+CS-1.5,y+CS-1);ctx.stroke()}
  });
  ctx.setLineDash([]);
}

function draw(){
  if(!grid)return;
  const W=gc.width,H=gc.height;
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);

  // Subtle grid
  ctx.strokeStyle='rgba(200,188,175,.45)';ctx.lineWidth=.5;
  for(let i=0;i<=gridSize;i++){
    ctx.beginPath();ctx.moveTo(i*CS,0);ctx.lineTo(i*CS,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*CS);ctx.lineTo(W,i*CS);ctx.stroke();
  }

  // Placed regions
  regions.forEach(({cells,color:[R,G,B]})=>{
    cells.forEach(({r,c})=>{
      ctx.fillStyle=`rgba(${R},${G},${B},.2)`;
      ctx.fillRect(c*CS+1,r*CS+1,CS-2,CS-2);
    });
    borders(cells,[R,G,B],.9,false);
  });

  // Compute drag preview info
  const isDragging = (lvlDef.mode==='box'&&bDrag) || (lvlDef.mode==='free'&&fPaint);
  let previewCells=[], isMatch=false, dragN=0;

  if(isDragging){
    if(lvlDef.mode==='box'&&bDrag&&bA&&bB){
      const{r1,c1,r2,c2}=normR(bA,bB);
      for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)previewCells.push({r,c});
    } else if(lvlDef.mode==='free'&&fPaint){
      previewCells=fCells;
    }
    dragN=previewCells.length;
    let numInDrag=0;
    for(const{r,c}of previewCells)if(grid[r][c]>0){numInDrag=grid[r][c];break}
    isMatch=dragN>0&&numInDrag>0&&dragN===numInDrag;
    showHUD(dragN,isMatch);
  } else {
    hideHUD();
  }

  // Draw preview
  if(isDragging && previewCells.length){
    const fillCol = isMatch?'rgba(107,203,119,.22)':'rgba(70,130,220,.1)';
    const lineCol = isMatch?[107,203,119]:[70,130,220];
    const lineAlpha = isMatch?.9:.55;
    previewCells.forEach(({r,c})=>{
      ctx.fillStyle=fillCol;ctx.fillRect(c*CS+1,r*CS+1,CS-2,CS-2);
    });
    borders(previewCells,lineCol,lineAlpha,lvlDef.mode==='free');
  }

  // Box mode: also show dashed rect outline
  if(lvlDef.mode==='box'&&bDrag&&bA&&bB){
    const{r1,c1,r2,c2}=normR(bA,bB);
    const x=c1*CS,y=r1*CS,w=(c2-c1+1)*CS,h=(r2-r1+1)*CS;
    ctx.strokeStyle=isMatch?'rgba(107,203,119,.8)':'rgba(70,130,220,.55)';
    ctx.lineWidth=2;ctx.setLineDash([6,3]);ctx.strokeRect(x+1,y+1,w-2,h-2);ctx.setLineDash([]);
  }

  // Crisp grid lines
  ctx.strokeStyle='rgba(210,198,185,.75)';ctx.lineWidth=1;
  for(let i=0;i<=gridSize;i++){
    ctx.beginPath();ctx.moveTo(i*CS,0);ctx.lineTo(i*CS,H);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*CS);ctx.lineTo(W,i*CS);ctx.stroke();
  }

  // Numbers
  const fs=Math.round(CS*.37);
  ctx.font=`700 ${fs}px 'IBM Plex Mono',monospace`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let r=0;r<gridSize;r++){
    for(let c=0;c<gridSize;c++){
      const v=grid[r][c];if(!v)continue;
      const cx=c*CS+CS/2,cy=r*CS+CS/2,ri=owner[r][c],cov=ri>=0,rad=CS*.25;
      // Check if in preview
      let inPrev=false;
      if(isDragging&&isMatch){
        if(lvlDef.mode==='box'&&bDrag&&bA&&bB){const{r1,c1,r2,c2}=normR(bA,bB);if(r>=r1&&r<=r2&&c>=c1&&c<=c2)inPrev=true}
        else if(lvlDef.mode==='free'&&fPaint)inPrev=fSet.has(ck(r,c));
      }
      ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);
      if(cov){const[R,G,B]=regions[ri].color;ctx.fillStyle=`rgba(${R},${G},${B},.45)`}
      else{ctx.fillStyle='rgba(255,250,244,.96)';ctx.shadowColor='rgba(100,50,20,.12)';ctx.shadowBlur=5}
      ctx.fill();ctx.shadowBlur=0;
      ctx.strokeStyle=inPrev?'rgba(107,203,119,.8)':cov?'rgba(0,0,0,.07)':'rgba(140,115,90,.3)';
      ctx.lineWidth=inPrev?2:1.5;ctx.stroke();
      ctx.fillStyle=cov?'rgba(45,32,21,.75)':'#2D2015';
      ctx.fillText(v,cx,cy+.5);
    }
  }
}

// ── EVENTS ──
function gp(e){const r=gc.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function tp(t){const r=gc.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top}}

function onDn(x,y){
  const cell=ptoc(x,y);if(!cell)return;
  const{r,c}=cell;

  // ── CLICK ON PLACED REGION: remove it ──
  if(owner[r][c]>=0){
    removeRegion(owner[r][c]);
    return;
  }

  // Start drag/paint
  if(lvlDef.mode==='box'){
    bDrag=true;bA=cell;bB=cell;
  } else {
    fPaint=true;fCells=[cell];fSet=new Set([ck(r,c)]);
    fOrder={};fOrder[ck(r,c)]=0;
  }
  draw();
}

function onMv(x,y){
  const cell=ptoc(x,y);if(!cell)return;
  const{r,c}=cell;

  if(lvlDef.mode==='box'&&bDrag){
    bB=cell;
  } else if(lvlDef.mode==='free'&&fPaint){
    const k=ck(r,c);
    if(fSet.has(k)){
      // ── DRAG BACK: backtrack to this cell ──
      const idx=fOrder[k];
      if(idx!==undefined && idx < fCells.length-1){
        // Remove all cells after this index
        const removed=fCells.splice(idx+1);
        removed.forEach(({r:rr,c:cc})=>{
          const kk=ck(rr,cc);fSet.delete(kk);delete fOrder[kk];
        });
      }
    } else if(owner[r][c]<0){
      // Add new cell
      fOrder[k]=fCells.length;
      fCells.push(cell);fSet.add(k);
    }
  }
  draw();
}

function onUp(){
  if(lvlDef.mode==='box'&&bDrag){
    bDrag=false;
    if(bA&&bB)tryBox();
    bA=null;bB=null;
  } else if(lvlDef.mode==='free'&&fPaint){
    fPaint=false;
    tryFree();
  }
  resetDrag();
  hideHUD();
  draw();
}

gc.addEventListener('mousedown',e=>{const p=gp(e);onDn(p.x,p.y)});
gc.addEventListener('mousemove',e=>{const p=gp(e);onMv(p.x,p.y)});
gc.addEventListener('mouseup',onUp);
gc.addEventListener('touchstart',e=>{e.preventDefault();const p=tp(e.touches[0]);onDn(p.x,p.y)},{passive:false});
gc.addEventListener('touchmove',e=>{e.preventDefault();const p=tp(e.touches[0]);onMv(p.x,p.y)},{passive:false});
gc.addEventListener('touchend',e=>{e.preventDefault();onUp()},{passive:false});
window.addEventListener('mouseup',()=>{if(bDrag||fPaint)onUp()});

// ── INIT ──
renderLevels();
</script>
</body>
</html>
